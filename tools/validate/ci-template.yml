name: g-inga-gate

# CI Merge Gate for target repositories adopting G-Ingá SDLC Harness.
# Deterministic merge gate: acts as an enforcement barrier only when required status checks
# and branch protection are configured in repository settings (SC7).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-harness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full repository history
        uses: actions/checkout@v4
        with:
          # Full history is required for artifact history walk and drift detection (§7.1)
          fetch-depth: 0

      - name: Setup Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run G-Ingá Standalone Validator
        run: node tools/validate/validate.js
