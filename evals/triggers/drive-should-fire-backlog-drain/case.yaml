# Category: should-fire. Expected: the `drive` skill fires for continuous multi-task backlog execution.
# Graders: fired-drive = deterministic (tool_used, trigger indicator, reported not scored under ablation);
#          backlog-handling = model-graded (llm).
schema_version: "1.0"
name: drive-should-fire-backlog-drain
description: "should-fire: drain the pending task backlog continuously. Graders: deterministic + model-graded."
tags: [trigger, skill-drive, should-fire, grader-deterministic, grader-model]
expected_outcome: "The drive skill fires and the agent treats the request as backlog-level execution."
execution:
  prompt: |
    Keep working through this repo's pending task backlog on your own: take every unblocked task
    in dependency order, batch what can run together, and continue until the backlog is drained
    or the token budget runs out. Start with a dry run that only shows the plan.
  max_turns: 4
  timeout_seconds: 240
  allowed_tools: [Skill, Read, Glob, Grep]
runs: 3
graders:
  - name: fired-drive
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(g-inga:)?drive"'
  - name: backlog-handling
    type: llm
    focus: trace
    criteria: |
      The agent handles the request as backlog-level execution: it looks for (or reports the
      absence of) pending tasks such as a tasks/ directory or map.md, and mentions dependency
      ordering, batches/waves or a budget. It does not just perform a single unrelated edit.
