# Category: should-fire + registration record (spec SC2).
# The scaffold copies the repo's project skill into the sandbox as .claude/skills/work, so in the
# with-plugin arm BOTH registrations exist: project `work` and plugin `g-inga:work`.
# Requires `--scaffold`; without it the case runs unstaged (plugin registration only) and the
# registration record for SC2 must be reported as `not run`.
# Known limitation (CLI 2.1.296): the scaffold runs before BOTH arms with a fixed environment
# (PATH, HOME, TMP*, TERM, GIT_CONFIG_NOSYSTEM, USER_TYPE, NODE_ENV) and no arm signal, so under
# `--ablation with-without` the no-plugin arm also holds the project `work` skill. That arm is not a
# no-`work` baseline: its routing-line score must not be read as an ablation delta. Read only the
# with-plugin arm's registration verdicts until the case runs under `--ablation none` (owner decision).
# Graders: invoked-plugin-registration / invoked-project-registration = deterministic (tool_used,
#          arm with-only: reported indicators, not scored). Exactly one is expected to pass per run;
#          the per-run verdicts in the JSON result are the registration record.
#          routing-line = deterministic (regex, scored in both arms).
schema_version: "1.0"
name: work-registration-precedence
description: "registration record: which of project `work` or plugin `g-inga:work` is invoked when both exist. Graders: deterministic only."
tags: [trigger, skill-work, should-fire, registration, grader-deterministic]
expected_outcome: "work fires; per-run verdicts show which registration (project or plugin) was invoked. No preferred winner is asserted."
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    New task for this repo: fix the typo "recieve" -> "receive" in README.md. Route it through
    the right ceremony tier first.
  max_turns: 4
  timeout_seconds: 240
  allowed_tools: [Skill, Read, Glob, Grep]
runs: 3
graders:
  - name: invoked-plugin-registration
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"g-inga:work"'
    arm: with-only
  - name: invoked-project-registration
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"work"'
    arm: with-only
  - name: routing-line
    type: regex
    target: trace
    pattern: 'tier:\s*(light|standard|heavy)'
    flags: i
