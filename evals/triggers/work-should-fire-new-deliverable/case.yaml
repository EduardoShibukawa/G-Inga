# Category: should-fire. Expected: the `work` skill fires and prints its routing line.
# Graders: fired-work = deterministic (tool_used, trigger indicator, reported not scored under ablation);
#          routing-line = deterministic (regex).
schema_version: "1.0"
name: work-should-fire-new-deliverable
description: "should-fire: a new repo deliverable must route through /work. Graders: deterministic only."
tags: [trigger, skill-work, should-fire, grader-deterministic]
expected_outcome: "The work skill fires and the agent prints a `tier: light|standard|heavy (...)` routing line."
execution:
  prompt: |
    I have a new deliverable for this repository: add a short CONTRIBUTING.md section that
    describes our commit message style. Pick the right ceremony tier for it and start the work.
  max_turns: 4
  timeout_seconds: 240
  allowed_tools: [Skill, Read, Glob, Grep]
runs: 3
graders:
  - name: fired-work
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(g-inga:)?work"'
  - name: routing-line
    type: regex
    target: trace
    pattern: 'tier:\s*(light|standard|heavy)'
    flags: i
