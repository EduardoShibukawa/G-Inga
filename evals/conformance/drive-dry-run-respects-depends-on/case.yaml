# Conformance case for claude plugin eval (schema 1.1). See ../README.md.
# Grader names: det-* = deterministic, model-graded-* = judged by the LLM grader.
schema_version: "1.1"
name: drive-dry-run-respects-depends-on
description: "drive, --dry-run: plans the backlog without executing, lists the task with no pending dependency as eligible and holds back the task whose depends_on is not yet verified. Graders: deterministic for no-execution; model-graded for the dependency verdict, because no deterministic check can read a free-form plan."
tags:
  - conformance
  - drive
expected_outcome: No file writes, no subagent dispatch, no git mutation. 2026-10-13-add-shout-option is eligible; 2026-10-13-document-shout-option is held back because its dependency is not verified.
execution:
  prompt: "Use the drive skill with --dry-run: show me which backlog tasks can run now and in what order. Do not execute anything."
  max_turns: 25
  timeout_seconds: 400
  allowed_tools:
    - Read
    - Glob
    - Grep
    - Skill
    - Bash
context:
  scaffold_script: fixture.sh
graders:
  - name: det-no-dispatch
    type: tool_used
    tool: Agent
    min: 0
    max: 0
    weight: 2
  - name: det-no-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
  - name: det-no-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
  - name: det-no-git-mutation
    type: tool_used
    tool: Bash
    input_match: git\s+(?:commit|add|checkout|worktree|reset)
    min: 0
    max: 0
  - name: det-names-eligible-task
    type: regex
    target: last_message
    pattern: add-shout-option
  - name: model-graded-depends-on-respected
    type: llm
    focus: last_message
    weight: 2
    criteria: |-
      PASS if the response presents 2026-10-13-add-shout-option as runnable now AND presents 2026-10-13-document-shout-option as not runnable yet (waiting, blocked or deferred) because its dependency 2026-10-13-add-shout-option is not verified or accepted.
      FAIL if 2026-10-13-document-shout-option is listed as runnable now, or placed in the same wave as or before its dependency, or if the response says it executed or changed anything.
  - name: det-skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?drive"'
